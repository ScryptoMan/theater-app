<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Индивидуальное мастерство</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #edeef0;
      color: #000;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      font-size: 19px;
      margin: 4px 0 12px;
      color: #2c3e50;
    }
    button {
      touch-action: manipulation;
    }
    .tabs {
      display: none;
      margin-bottom: 12px;
      background: #e1e3e6;
      padding: 3px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: #555;
    }
    .tab-btn.active {
      background: #fff;
      color: #000;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .edit-mode-bar {
      display: none;
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .btn-edit-toggle {
      background: #e5ebf1;
      color: #224b7a;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-save-batch {
      background: #4bb34b;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel-edit {
      background: #e0e0e0;
      color: #333;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .day-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f2f3f5;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .day-title {
      font-weight: 600;
      font-size: 15px;
      color: #224b7a;
    }
    .day-note {
      font-size: 12px;
      color: #e65100;
      margin-top: 2px;
    }
    .btn-delete-day {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      color: #d32f2f;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .slot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #f5f5f5;
    }
    .slot-item:last-child {
      border-bottom: none;
    }
    .slot-time {
      font-weight: 600;
      font-size: 15px;
    }
    .input-time-inline {
      width: 65px;
      padding: 4px 6px;
      border: 1px solid #2787f5;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .select-member-inline {
      max-width: 145px;
      padding: 5px 6px;
      border: 1px solid #2787f5;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .slot-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-booked {
      background: #f0f2f5;
      color: #333;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-free {
      background: #4bb34b;
      color: #fff;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      background: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-del-slot {
      background: #ffebee;
      color: #d32f2f;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }
    .admin-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .admin-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 1px solid #dce1e6;
      border-radius: 8px;
      font-size: 14px;
    }
    .btn-primary {
      background: #2787f5;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      cursor: pointer;
    }
    .btn-secondary {
      background: #e5ebf1;
      color: #224b7a;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      cursor: pointer;
    }
    .preview-box {
      background: #f8f9fb;
      border: 1px solid #e1e3e6;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      max-height: 240px;
      overflow-y: auto;
    }
    .preview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #eaeaea;
      font-size: 13px;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }
    /* Универсальное модальное окно вместо alert/confirm для iOS */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }
    .modal-text {
      font-size: 14px;
      color: #555;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .modal-btn-ok {
      background: #2787f5;
      color: #fff;
    }
    .modal-btn-cancel {
      background: #edeef0;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎭 Индивидуальное мастерство</h2>

    <div id="adminTabs" class="tabs">
      <button class="tab-btn active" onclick="switchTab('schedule')">📅 Расписание</button>
      <button class="tab-btn" onclick="switchTab('admin')">➕ Добавить / Шаблон</button>
    </div>

    <!-- Вкладка 1: Просмотр и запись -->
    <div id="tabSchedule">
      
      <div id="adminEditToggleBar" style="display:none; text-align:right;">
        <button class="btn-edit-toggle" id="btnToggleEdit" onclick="toggleEditMode()">✏️ Включить режим правки</button>
      </div>

      <div id="editModeBar" class="edit-mode-bar">
        <span style="font-size:12px; font-weight:600; color:#e65100;">⚠️ Режим правки (чат молчит)</span>
        <div style="display:flex; gap:6px;">
          <button class="btn-cancel-edit" onclick="cancelEditMode()">Отмена</button>
          <button class="btn-save-batch" onclick="saveBatchSchedule()">💾 Сохранить в чат</button>
        </div>
      </div>

      <div id="content" class="loading">⏳ Загружаем расписание...</div>
    </div>

    <!-- Вкладка 2: Конструктор для админа -->
    <div id="tabAdmin" style="display:none;">
      
      <div class="admin-card">
        <h3>⚡ Добавить слоты в расписание</h3>
        
        <div class="form-group" style="background:#f4f6f9; padding:10px; border-radius:10px; margin-bottom:12px;">
          <label style="font-weight:600;">1. Вставить неделю по шаблону (Вт 15-18, Ср 15-18, Пт 18-20):</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <input type="date" id="templateDate" class="input-field" style="flex:1;">
            <button class="btn-secondary" style="width:auto; padding:0 12px;" onclick="addTemplateToDraft()">+ Неделя</button>
          </div>
        </div>

        <div class="form-group" style="background:#f4f6f9; padding:10px; border-radius:10px;">
          <label style="font-weight:600;">2. Или добавить один день / время:</label>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <input type="date" id="singleDate" class="input-field" style="flex:1.2;" onchange="updateDayLabel()">
            <input type="text" id="singleTime" placeholder="15:30" class="input-field" style="width:70px;">
            <button class="btn-secondary" style="width:auto; padding:0 12px;" onclick="addSingleSlotToDraft()">+ Слот</button>
          </div>
          <div style="font-size:11px; color:#224b7a; margin-top:4px;" id="dayOfWeekLabel"></div>
        </div>
      </div>

      <div class="admin-card" id="draftCard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h3 style="margin:0;">📝 Слоты к добавлению:</h3>
          <span style="font-size:12px; color:#d32f2f; cursor:pointer;" onclick="clearDraft()">Очистить</span>
        </div>

        <div class="preview-box" id="draftList"></div>

        <button class="btn-primary" style="margin-top:12px;" onclick="commitDraftToSchedule()">🚀 Сохранить и добавить в расписание</button>
      </div>

    </div>
  </div>

  <!-- Надежное всплывающее окно для iPhone и Android -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title">Подтверждение</div>
      <div id="modalText" class="modal-text"></div>
      <div class="modal-actions">
        <button id="modalBtnCancel" class="modal-btn modal-btn-cancel">Отмена</button>
        <button id="modalBtnOk" class="modal-btn modal-btn-ok">Да</button>
      </div>
    </div>
  </div>

  <script>
    vkBridge.send('VKWebAppInit');

    let currentUser = { name: "Ученик", id: "" };
    let adminList = [];
    let chatProfiles = [];
    let scheduleData = [];
    let editDraft = [];
    let isEditMode = false;
    let builderDraft = [];

    const API_URL = "https://script.google.com/macros/s/AKfycbwpKimw8EQfVQfuH4p7dYNIZM-UWQQNBDD5iUG_stdMpvTshCdJZmlC8BCn9rMnwwsNsA/exec";

    // 0. Замена alert/confirm для работы на iOS:
    function showModal(title, text, isConfirm, onOk) {
      var modal = document.getElementById('customModal');
      var t = document.getElementById('modalTitle');
      var m = document.getElementById('modalText');
      var btnOk = document.getElementById('modalBtnOk');
      var btnCancel = document.getElementById('modalBtnCancel');

      t.innerText = title || "Внимание";
      m.innerText = text || "";
      btnCancel.style.display = isConfirm ? 'block' : 'none';
      modal.style.display = 'flex';

      btnOk.onclick = function() {
        modal.style.display = 'none';
        if (onOk) onOk();
      };
      btnCancel.onclick = function() {
        modal.style.display = 'none';
      };
    }

    function appConfirm(text, onOk) {
      showModal("Подтверждение", text, true, onOk);
    }

    function appAlert(text) {
      showModal("Сообщение", text, false);
    }

    // 1. Авторизация:
    vkBridge.send('VKWebAppGetUserInfo')
      .then(function(user) {
        if (user && user.id) {
          currentUser.id = String(user.id);
          currentUser.name = user.first_name + " " + user.last_name;
        }
        loadSchedule();
      })
      .catch(function() {
        var urlParams = new URLSearchParams(window.location.search);
        currentUser.id = urlParams.get('vk_user_id') || "";
        loadSchedule();
      });

    // 2. Загрузка данных:
    function loadSchedule() {
      fetch(API_URL + "?vk_id=" + encodeURIComponent(currentUser.id))
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.access_denied) {
            document.getElementById('content').innerHTML = 
              '<div style="background:#fff; border-radius:14px; padding:28px 20px; text-align:center; margin-top:40px;">' +
              '<div style="font-size:42px;margin-bottom:12px;">🔒</div>' +
              '<h3 style="margin:0 0 8px;color:#c62828;">Доступ ограничен</h3>' +
              '<p style="color:#555;font-size:14px;">' + (data.error || "") + '</p></div>';
            return;
          }

          adminList = (data.admins || []).map(String);
          chatProfiles = data.profiles || [];
          scheduleData = data.schedule || [];

          if (adminList.indexOf(currentUser.id) !== -1) {
            document.getElementById('adminTabs').style.display = 'flex';
            document.getElementById('adminEditToggleBar').style.display = 'block';
          }

          renderSchedule();
        })
        .catch(function() {
          document.getElementById('content').innerHTML = '<p style="text-align:center;color:red;">Ошибка соединения с сервером</p>';
        });
    }

    // 3. Отрисовка расписания:
    function renderSchedule() {
      var items = isEditMode ? editDraft : scheduleData;

      if (!items || items.length === 0) {
        document.getElementById('content').innerHTML = '<p style="text-align:center;color:#888;padding:30px;">Расписание пусто.<br>Занятия не назначены.</p>';
        return;
      }

      var daysMap = {};
      items.forEach(function(slot, index) {
        if (!daysMap[slot.date]) {
          daysMap[slot.date] = {
            title: slot.day_title,
            note: slot.note,
            slots: []
          };
        }
        var sCopy = Object.assign({}, slot);
        sCopy.draftIndex = index;
        daysMap[slot.date].slots.push(sCopy);
      });

      var html = '';

      for (var date in daysMap) {
        var dayObj = daysMap[date];
        html += '<div class="day-card">' +
          '<div class="day-header"><div><div class="day-title">✏️ ' + dayObj.title + '</div>' +
          (dayObj.note ? '<div class="day-note">' + dayObj.note + '</div>' : '') + '</div>' +
          (isEditMode ? '<button class="btn-delete-day" onclick="draftDeleteDay(\'' + date + '\')">✕ Удалить день</button>' : '') +
          '</div>';

        dayObj.slots.forEach(function(slot) {
          var isFree = (slot.status === 'Свободно' || !slot.name);
          var isMySlot = currentUser.id && (String(slot.vk_id) === currentUser.id);

          html += '<div class="slot-item">' +
            (isEditMode 
              ? '<input type="text" class="input-time-inline" value="' + slot.time + '" onchange="draftUpdateTime(' + slot.draftIndex + ', this.value)">'
              : '<span class="slot-time">' + slot.time + '</span>') +
            '<div class="slot-right">';

          if (!isEditMode && isFree) {
            html += '<button class="btn-free" onclick="bookSlot(\'' + slot.date + '\', \'' + slot.time + '\', this)">Записаться</button>';
          }

          if (!isFree) {
            html += '<span class="badge-booked">👤 ' + slot.name + '</span>';
          }

          if (!isEditMode && !isFree && isMySlot) {
            html += '<button class="btn-cancel" title="Снять свою бронь" onclick="cancelSlot(\'' + slot.date + '\', \'' + slot.time + '\', this)">✕</button>';
          }

          if (isEditMode) {
            html += '<select class="select-member-inline" onchange="draftAssignMember(' + slot.draftIndex + ', this.value)">' +
              '<option value="" ' + (isFree ? 'selected' : '') + '>[Свободно]</option>';

            chatProfiles.forEach(function(p) {
              var isSelected = (!isFree && (String(slot.vk_id) === p.id || slot.name === p.name));
              html += '<option value="' + p.id + '" ' + (isSelected ? 'selected' : '') + '>' + p.name + '</option>';
            });

            html += '</select><button class="btn-del-slot" title="Удалить слот" onclick="draftDeleteSlot(' + slot.draftIndex + ')">✕</button>';
          }

          html += '</div></div>';
        });

        html += '</div>';
      }

      document.getElementById('content').innerHTML = html;
    }

    // 4. Режим правки:
    function toggleEditMode() {
      isEditMode = true;
      editDraft = JSON.parse(JSON.stringify(scheduleData));
      document.getElementById('editModeBar').style.display = 'flex';
      document.getElementById('adminEditToggleBar').style.display = 'none';
      renderSchedule();
    }

    function cancelEditMode() {
      isEditMode = false;
      editDraft = [];
      document.getElementById('editModeBar').style.display = 'none';
      document.getElementById('adminEditToggleBar').style.display = 'block';
      renderSchedule();
    }

    function draftDeleteSlot(index) {
      editDraft.splice(index, 1);
      renderSchedule();
    }

    function draftDeleteDay(date) {
      appConfirm("Удалить этот день со всеми слотами?", function() {
        editDraft = editDraft.filter(function(s) { return s.date !== date; });
        renderSchedule();
      });
    }

    function draftUpdateTime(index, newTime) {
      if (editDraft[index]) {
        editDraft[index].time = newTime.trim();
      }
    }

    function draftAssignMember(index, selectedVkId) {
      if (!editDraft[index]) return;

      if (!selectedVkId) {
        editDraft[index].name = "";
        editDraft[index].status = "Свободно";
        editDraft[index].vk_id = "";
        editDraft[index].forceClear = true;
      } else {
        var found = null;
        for (var i = 0; i < chatProfiles.length; i++) {
          if (chatProfiles[i].id === selectedVkId) {
            found = chatProfiles[i];
            break;
          }
        }
        editDraft[index].name = found ? found.name : "Ученик";
        editDraft[index].status = "Занято";
        editDraft[index].vk_id = selectedVkId;
        editDraft[index].forceClear = false;
      }
    }

    function saveBatchSchedule() {
      var btn = document.querySelector('.btn-save-batch');
      btn.innerText = "⏳ Сохранение...";
      btn.disabled = true;

      var logText = "⚙️ " + currentUser.name + " — Правка расписания";
      var url = API_URL + "?action=save_batch_schedule&vk_id=" + encodeURIComponent(currentUser.id) + 
                "&action_desc=" + encodeURIComponent(logText) + 
                "&slots=" + encodeURIComponent(JSON.stringify(editDraft));

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          btn.innerText = "💾 Сохранить в чат";
          btn.disabled = false;
          if (res.success) {
            appAlert("✅ Изменения сохранены и отправлены в чат!");
            cancelEditMode();
            loadSchedule();
          } else {
            appAlert("❌ " + (res.error || "Ошибка"));
          }
        })
        .catch(function() {
          appAlert("Ошибка сети");
          btn.innerText = "💾 Сохранить в чат";
          btn.disabled = false;
        });
    }

    // 5. Конструктор:
    function addTemplateToDraft() {
      var selected = document.getElementById('templateDate').value;
      if (!selected) return appAlert("Выберите дату недели!");

      var parts = selected.split('-').map(Number);
      var refDate = new Date(parts[0], parts[1] - 1, parts[2]);
      var dayOfWeek = refDate.getDay();
      var diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      var monday = new Date(refDate);
      monday.setDate(refDate.getDate() + diffToMon);

      function getDate(offset) {
        var t = new Date(monday);
        t.setDate(monday.getDate() + offset);
        var yyyy = t.getFullYear();
        var mm = String(t.getMonth() + 1).padStart(2, '0');
        var dd = String(t.getDate()).padStart(2, '0');
        return yyyy + '-' + mm + '-' + dd;
      }

      var tue = getDate(1);
      var wed = getDate(2);
      var fri = getDate(4);

      var templateSlots = [
        { date: tue, dayTitle: "Вторник", time: "15:00" },
        { date: tue, dayTitle: "Вторник", time: "16:00" },
        { date: tue, dayTitle: "Вторник", time: "17:00" },
        { date: tue, dayTitle: "Вторник", time: "18:00" },
        { date: wed, dayTitle: "Среда", time: "15:00" },
        { date: wed, dayTitle: "Среда", time: "16:00" },
        { date: wed, dayTitle: "Среда", time: "17:00" },
        { date: wed, dayTitle: "Среда", time: "18:00" },
        { date: fri, dayTitle: "Пятница", time: "18:00" },
        { date: fri, dayTitle: "Пятница", time: "19:00" },
        { date: fri, dayTitle: "Пятница", time: "20:00" }
      ];

      templateSlots.forEach(function(s) {
        pushSlotToDraft(s.date, s.dayTitle, s.time);
      });
      renderDraftList();
    }

    function addSingleSlotToDraft() {
      var date = document.getElementById('singleDate').value;
      var time = document.getElementById('singleTime').value.trim();
      if (!date || !time) return appAlert("Укажите дату и время!");

      var parts = date.split('-').map(Number);
      var days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
      var dayName = days[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];

      pushSlotToDraft(date, dayName, time);
      document.getElementById('singleTime').value = '';
      renderDraftList();
    }

    function pushSlotToDraft(date, dayTitle, time) {
      var existingIdx = -1;
      for (var i = 0; i < builderDraft.length; i++) {
        if (builderDraft[i].date === date && builderDraft[i].time === time) {
          existingIdx = i;
          break;
        }
      }

      if (existingIdx !== -1) {
        builderDraft[existingIdx] = { date: date, dayTitle: dayTitle, time: time };
      } else {
        builderDraft.push({ date: date, dayTitle: dayTitle, time: time });
      }

      builderDraft.sort(function(a, b) {
        return (a.date + a.time).localeCompare(b.date + b.time);
      });
    }

    function renderDraftList() {
      if (builderDraft.length === 0) {
        document.getElementById('draftCard').style.display = 'none';
        return;
      }
      document.getElementById('draftCard').style.display = 'block';

      var html = '';
      builderDraft.forEach(function(s, idx) {
        html += '<div class="preview-row">' +
          '<span><b>' + s.dayTitle + '</b> (' + s.date.split('-').slice(1).reverse().join('.') + ')</span>' +
          '<div style="display:flex; align-items:center; gap:6px;">' +
          '<input type="text" class="input-time-inline" value="' + s.time + '" onchange="builderDraft[' + idx + '].time = this.value">' +
          '<span style="color:#d32f2f; cursor:pointer; font-weight:bold; padding:2px 6px;" onclick="removeDraftSlot(' + idx + ')">✕</span>' +
          '</div></div>';
      });
      document.getElementById('draftList').innerHTML = html;
    }

    function removeDraftSlot(idx) {
      builderDraft.splice(idx, 1);
      renderDraftList();
    }

    function clearDraft() {
      builderDraft = [];
      renderDraftList();
    }

    function commitDraftToSchedule() {
      if (builderDraft.length === 0) return;

      var btn = document.querySelector('#draftCard .btn-primary');
      btn.innerText = "⏳ Сохранение...";
      btn.disabled = true;

      var map = {};
      scheduleData.forEach(function(s) {
        map[s.date + "_" + s.time] = s;
      });

      builderDraft.forEach(function(s) {
        var key = s.date + "_" + s.time;
        if (!map[key]) {
          map[key] = {
            date: s.date,
            time: s.time,
            name: "",
            status: "Свободно",
            vk_id: "",
            note: ""
          };
        }
      });

      // Собираем массив без Object.values для совместимости:
      var mergedSlots = [];
      for (var k in map) {
        if (map.hasOwnProperty(k)) {
          mergedSlots.push(map[k]);
        }
      }

      var logText = "📅 " + currentUser.name + " — Добавлены новые дни";
      var url = API_URL + "?action=save_batch_schedule&vk_id=" + encodeURIComponent(currentUser.id) + 
                "&action_desc=" + encodeURIComponent(logText) + 
                "&slots=" + encodeURIComponent(JSON.stringify(mergedSlots));

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          btn.innerText = "🚀 Сохранить и добавить в расписание";
          btn.disabled = false;
          if (res.success) {
            appAlert("✅ Расписание успешно обновлено!");
            clearDraft();
            switchTab('schedule');
            loadSchedule();
          } else {
            appAlert("❌ " + (res.error || "Ошибка"));
          }
        })
        .catch(function() {
          appAlert("Ошибка сети");
          btn.innerText = "🚀 Сохранить и добавить в расписание";
          btn.disabled = false;
        });
    }

    function updateDayLabel() {
      var val = document.getElementById('singleDate').value;
      if (!val) { document.getElementById('dayOfWeekLabel').innerText = ''; return; }
      var parts = val.split('-').map(Number);
      var days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
      var dayName = days[new Date(parts[0], parts[1] - 1, parts[2]).getDay()];
      document.getElementById('dayOfWeekLabel').innerText = 'День недели: ' + dayName;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      if (tab === 'schedule') {
        document.querySelector('.tab-btn:first-child').classList.add('active');
        document.getElementById('tabSchedule').style.display = 'block';
        document.getElementById('tabAdmin').style.display = 'none';
      } else {
        document.querySelector('.tab-btn:last-child').classList.add('active');
        document.getElementById('tabSchedule').style.display = 'none';
        document.getElementById('tabAdmin').style.display = 'block';
      }
    }

    // 6. Обычная запись ученика:
    function bookSlot(date, time, btn) {
      appConfirm("Записаться на " + time + " под именем " + currentUser.name + "?", function() {
        btn.innerText = "⏳";
        btn.disabled = true;

        fetch(API_URL + "?action=book&date=" + date + "&time=" + time + "&name=" + encodeURIComponent(currentUser.name) + "&vk_id=" + encodeURIComponent(currentUser.id))
          .then(function(res) { return res.json(); })
          .then(function(res) {
            if (res.success) {
              loadSchedule();
            } else {
              appAlert(res.error || "Ошибка записи");
              loadSchedule();
            }
          })
          .catch(function() {
            appAlert("Ошибка сети");
            loadSchedule();
          });
      });
    }

    // 7. Снятие СВОЕЙ брони:
    function cancelSlot(date, time, btn) {
      appConfirm("Снять свою бронь на " + time + "?", function() {
        btn.innerText = "⏳";
        btn.disabled = true;

        fetch(API_URL + "?action=cancel&date=" + date + "&time=" + time + "&vk_id=" + encodeURIComponent(currentUser.id))
          .then(function(res) { return res.json(); })
          .then(function(res) {
            if (res.success) {
              loadSchedule();
            } else {
              appAlert(res.error || "Ошибка отмены");
              loadSchedule();
            }
          })
          .catch(function() {
            appAlert("Ошибка сети");
            loadSchedule();
          });
      });
    }
  </script>
</body>
</html>
