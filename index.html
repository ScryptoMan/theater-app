<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Индивидуальное мастерство</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #edeef0;
      color: #000;
    }
    .container {
      max-width: 460px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      font-size: 19px;
      margin: 4px 0 14px;
      color: #2c3e50;
    }
    .tabs {
      display: none;
      margin-bottom: 14px;
      background: #e1e3e6;
      padding: 3px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: #555;
    }
    .tab-btn.active {
      background: #fff;
      color: #000;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .day-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f2f3f5;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .day-title {
      font-weight: 600;
      font-size: 15px;
      color: #224b7a;
    }
    .day-note {
      font-size: 12px;
      color: #e65100;
      margin-top: 2px;
      font-weight: normal;
    }
    .btn-delete-day {
      background: transparent;
      border: none;
      color: #d32f2f;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .btn-delete-day:hover {
      background: #ffebee;
    }
    .slot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #f5f5f5;
    }
    .slot-item:last-child {
      border-bottom: none;
    }
    .slot-time {
      font-weight: 600;
      font-size: 15px;
    }
    .slot-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-booked {
      background: #f0f2f5;
      color: #333;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-free {
      background: #4bb34b;
      color: #fff;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      background: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-del-slot {
      background: transparent;
      color: #999;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }
    .btn-del-slot:hover {
      color: #d32f2f;
    }
    .admin-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .admin-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 1px solid #dce1e6;
      border-radius: 8px;
      font-size: 14px;
    }
    .btn-primary {
      background: #2787f5;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      cursor: pointer;
    }
    .btn-secondary {
      background: #e5ebf1;
      color: #224b7a;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      cursor: pointer;
    }
    .lock-box {
      background: #fff;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      margin-top: 40px;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎭 Индивидуальное мастерство</h2>

    <div id="adminTabs" class="tabs">
      <button class="tab-btn active" onclick="switchTab('schedule')">📅 Расписание</button>
      <button class="tab-btn" onclick="switchTab('admin')">➕ Добавить / Шаблон</button>
    </div>

    <!-- Вкладка 1: Просмотр и запись -->
    <div id="tabSchedule">
      <div id="content" class="loading">⏳ Загружаем расписание...</div>
    </div>

    <!-- Вкладка 2: Панель добавления для админов -->
    <div id="tabAdmin" style="display:none;">
      
      <!-- Блок 1: Умный шаблон от даты (без лишних надписей) -->
      <div class="admin-card">
        <h3>📋 Создать неделю по шаблону (Вт, Ср, Пт)</h3>
        <div class="form-group">
          <label>Выберите любую дату нужной недели:</label>
          <input type="date" id="templateDate" class="input-field">
        </div>
        <button class="btn-secondary" onclick="applyTemplate()">Сформировать неделю по шаблону</button>
      </div>

      <!-- Блок 2: Точечное добавление времени/дня -->
      <div class="admin-card">
        <h3>✏️ Добавить отдельный день / время</h3>
        <div class="form-group">
          <label>Дата: <b id="dayOfWeekLabel" style="color:#224b7a;"></b></label>
          <input type="date" id="singleDate" class="input-field" onchange="updateDayLabel()">
        </div>
        <div class="form-group">
          <label>Время (например, 16:00):</label>
          <input type="text" id="singleTime" placeholder="16:00" class="input-field">
        </div>
        <div class="form-group">
          <label>Заметка к дню (только если нужна):</label>
          <input type="text" id="singleNote" placeholder="Оставьте пустым, если не нужно" class="input-field">
        </div>
        <button class="btn-primary" onclick="addSingleSlot()">+ Добавить слот в расписание</button>
      </div>

    </div>
  </div>

  <script>
    vkBridge.send('VKWebAppInit');

    let currentUser = { name: "Ученик", id: "" };
    let adminList = [];
    const API_URL = "https://script.google.com/macros/s/AKfycbwpKimw8EQfVQfuH4p7dYNIZM-UWQQNBDD5iUG_stdMpvTshCdJZmlC8BCn9rMnwwsNsA/exec";

    // 1. Авторизация: берем ПОЛНОЕ имя и фамилию:
    vkBridge.send('VKWebAppGetUserInfo')
      .then(user => {
        if (user && user.id) {
          currentUser.id = String(user.id);
          currentUser.name = user.first_name + " " + user.last_name; // Имя полностью
        }
        loadSchedule();
      })
      .catch(() => {
        const urlParams = new URLSearchParams(window.location.search);
        currentUser.id = urlParams.get('vk_user_id') || "";
        loadSchedule();
      });

    // 2. Загрузка данных:
    function loadSchedule() {
      fetch(API_URL + "?vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(data => {
          if (data.access_denied) {
            document.getElementById('content').innerHTML = `
              <div class="lock-box">
                <div style="font-size:42px;margin-bottom:12px;">🔒</div>
                <h3 style="margin:0 0 8px;color:#c62828;">Доступ ограничен</h3>
                <p style="color:#555;font-size:14px;">${data.error}</p>
              </div>`;
            return;
          }

          adminList = (data.admins || []).map(String);
          if (adminList.includes(currentUser.id)) {
            document.getElementById('adminTabs').style.display = 'flex';
          }

          renderSchedule(data.schedule || []);
        });
    }

    // 3. Отрисовка расписания:
    function renderSchedule(items) {
      if (!items || items.length === 0) {
        document.getElementById('content').innerHTML = '<p style="text-align:center;color:#888;">Расписание пока пусто.<br>Администратор может добавить даты во вкладке выше.</p>';
        return;
      }

      const daysMap = {};
      items.forEach(slot => {
        if (!daysMap[slot.date]) {
          daysMap[slot.date] = {
            title: slot.day_title,
            note: slot.note,
            slots: []
          };
        }
        daysMap[slot.date].slots.push(slot);
      });

      let html = '';
      const isAdmin = currentUser.id && adminList.includes(currentUser.id);

      for (const date in daysMap) {
        const dayObj = daysMap[date];
        html += `
          <div class="day-card">
            <div class="day-header">
              <div>
                <div class="day-title">✏️ ${dayObj.title}</div>
                ${dayObj.note ? `<div class="day-note">${dayObj.note}</div>` : ''}
              </div>
              ${isAdmin ? `<button class="btn-delete-day" onclick="deleteDay('${date}')" title="Удалить этот день целиком">✕ день</button>` : ''}
            </div>
        `;

        dayObj.slots.forEach(slot => {
          const isFree = (slot.status === 'Свободно');
          const isMySlot = currentUser.id && (String(slot.vk_id) === currentUser.id);
          const canCancel = isMySlot || isAdmin;

          html += `
            <div class="slot-item">
              <span class="slot-time">${slot.time}</span>
              <div class="slot-right">
                ${isFree 
                  ? `<button class="btn-free" onclick="bookSlot('${slot.date}', '${slot.time}', this)">Записаться</button>` 
                  : `<span class="badge-booked">👤 ${slot.name}</span>`}
                ${!isFree && canCancel 
                  ? `<button class="btn-cancel" title="Снять бронь" onclick="cancelSlot('${slot.date}', '${slot.time}', this)">✕</button>` 
                  : ''}
                ${isFree && isAdmin 
                  ? `<button class="btn-del-slot" title="Удалить это время" onclick="deleteSlot('${slot.date}', '${slot.time}')">🗑</button>` 
                  : ''}
              </div>
            </div>`;
        });

        html += `</div>`;
      }

      document.getElementById('content').innerHTML = html;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'schedule') {
        document.querySelector('.tab-btn:first-child').classList.add('active');
        document.getElementById('tabSchedule').style.display = 'block';
        document.getElementById('tabAdmin').style.display = 'none';
      } else {
        document.querySelector('.tab-btn:last-child').classList.add('active');
        document.getElementById('tabSchedule').style.display = 'none';
        document.getElementById('tabAdmin').style.display = 'block';
      }
    }

    // Подсказка дня недели в календарике:
    function updateDayLabel() {
      const val = document.getElementById('singleDate').value;
      if (!val) { document.getElementById('dayOfWeekLabel').innerText = ''; return; }
      const [y, m, d] = val.split('-').map(Number);
      const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
      const dayName = days[new Date(y, m - 1, d).getDay()];
      document.getElementById('dayOfWeekLabel').innerText = `(${dayName})`;
    }

    // ЧИСТЫЙ шаблон (Вт, Ср, Пт) без самовольных надписей:
    function applyTemplate() {
      const selected = document.getElementById('templateDate').value;
      if (!selected) return alert("Выберите дату недели!");

      const [y, m, d] = selected.split('-').map(Number);
      const refDate = new Date(y, m - 1, d);
      const dayOfWeek = refDate.getDay();
      const diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      const monday = new Date(refDate);
      monday.setDate(refDate.getDate() + diffToMon);

      function getDate(offset) {
        const t = new Date(monday);
        t.setDate(monday.getDate() + offset);
        const yyyy = t.getFullYear();
        const mm = String(t.getMonth() + 1).padStart(2, '0');
        const dd = String(t.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }

      const tue = getDate(1);
      const wed = getDate(2);
      const fri = getDate(4);

      // Только дни и время, без постороннего текста:
      const slots = [
        { date: tue, time: "16:00", note: "" },
        { date: tue, time: "17:00", note: "" },
        { date: tue, time: "18:00", note: "" },
        { date: wed, time: "15:00", note: "" },
        { date: wed, time: "16:00", note: "" },
        { date: wed, time: "17:00", note: "" },
        { date: wed, time: "18:00", note: "" },
        { date: fri, time: "18:00", note: "" },
        { date: fri, time: "19:00", note: "" },
        { date: fri, time: "20:00", note: "" }
      ];

      sendSlots(slots);
    }

    function addSingleSlot() {
      const date = document.getElementById('singleDate').value;
      const time = document.getElementById('singleTime').value.trim();
      const note = document.getElementById('singleNote').value.trim();
      if (!date || !time) return alert("Укажите дату и время!");

      sendSlots([{ date, time, note }]);
    }

    function sendSlots(slots) {
      const url = API_URL + "?action=add_slots&vk_id=" + encodeURIComponent(currentUser.id) + "&slots=" + encodeURIComponent(JSON.stringify(slots));
      fetch(url)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            alert("✅ Добавлено в расписание!");
            switchTab('schedule');
            loadSchedule();
          } else {
            alert(res.error || "Ошибка");
          }
        });
    }

    function deleteDay(date) {
      if (!confirm("Удалить этот день целиком со всеми слотами?")) return;
      fetch(API_URL + "?action=delete_day&date=" + date + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) loadSchedule();
          else alert(res.error);
        });
    }

    function deleteSlot(date, time) {
      if (!confirm("Удалить время " + time + "?")) return;
      fetch(API_URL + "?action=delete_slot&date=" + date + "&time=" + time + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) loadSchedule();
          else alert(res.error);
        });
    }

    function bookSlot(date, time, btn) {
      if (!confirm("Записаться на " + time + " под именем " + currentUser.name + "?")) return;
      btn.innerText = "⏳";
      btn.disabled = true;

      fetch(API_URL + "?action=book&date=" + date + "&time=" + time + "&name=" + encodeURIComponent(currentUser.name) + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) loadSchedule();
          else alert(res.error || "Ошибка");
        });
    }

    function cancelSlot(date, time, btn) {
      if (!confirm("Снять бронь на " + time + "?")) return;
      btn.innerText = "⏳";
      btn.disabled = true;

      fetch(API_URL + "?action=cancel&date=" + date + "&time=" + time + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) loadSchedule();
          else alert(res.error);
        });
    }
  </script>
</body>
</html>
