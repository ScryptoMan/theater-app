<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на мастерство</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #edeef0;
      color: #000;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      font-size: 19px;
      margin: 8px 0 16px;
      color: #2c3e50;
    }
    .day-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .day-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 10px;
      color: #224b7a;
      border-bottom: 1px solid #f2f3f5;
      padding-bottom: 6px;
    }
    .slot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #f5f5f5;
    }
    .slot-item:last-child {
      border-bottom: none;
    }
    .slot-time {
      font-weight: 600;
      font-size: 15px;
    }
    .slot-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-booked {
      background: #f0f2f5;
      color: #656565;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-free {
      background: #4bb34b;
      color: #fff;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      background: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-box {
      background: #fff;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-top: 40px;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎭 Индивидуальное мастерство</h2>
    <div id="content" class="loading">⏳ Загружаем расписание...</div>
  </div>

  <script>
    vkBridge.send('VKWebAppInit');

    let currentUser = { name: "Ученик", id: "" };
    let adminList = [];
    const API_URL = "https://script.google.com/macros/s/AKfycbwpKimw8EQfVQfuH4p7dYNIZM-UWQQNBDD5iUG_stdMpvTshCdJZmlC8BCn9rMnwwsNsA/exec";

    // 1. Авторизация через ВК:
    vkBridge.send('VKWebAppGetUserInfo')
      .then(user => {
        if (user && user.id) {
          currentUser.id = String(user.id);
          currentUser.name = user.first_name + " " + (user.last_name ? user.last_name[0] + "." : "");
        }
        loadSchedule();
      })
      .catch(() => {
        // Запасной способ получить ID из ссылки ВК:
        const urlParams = new URLSearchParams(window.location.search);
        currentUser.id = urlParams.get('vk_user_id') || "";
        loadSchedule();
      });

    // 2. Запрос расписания с передачей ID для проверки доступа:
    function loadSchedule() {
      const url = API_URL + "?vk_id=" + encodeURIComponent(currentUser.id);
      
      fetch(url)
        .then(res => res.json())
        .then(data => {
          // Если Google Таблица не нашла человека в беседе:
          if (data.access_denied) {
            document.getElementById('content').innerHTML = `
              <div class="lock-box">
                <div style="font-size:42px;margin-bottom:12px;">🔒</div>
                <h3 style="margin:0 0 8px;color:#c62828;">Доступ ограничен</h3>
                <p style="color:#555;font-size:14px;line-height:1.5;">${data.error}</p>
              </div>
            `;
            return;
          }

          adminList = (data.admins || []).map(String);
          renderSchedule(data.schedule || []);
        })
        .catch(err => {
          document.getElementById('content').innerHTML = '<p style="color:red;text-align:center;">Ошибка соединения</p>';
          console.error(err);
        });
    }

    // 3. Отрисовка расписания:
    function renderSchedule(items) {
      if (!items || items.length === 0) {
        document.getElementById('content').innerHTML = '<p style="text-align:center;">Расписание пока пусто</p>';
        return;
      }

      const days = {};
      items.forEach(item => {
        if (!days[item.day]) days[item.day] = [];
        days[item.day].push(item);
      });

      let html = '';
      for (const day in days) {
        html += `<div class="day-card"><div class="day-title">🗓 ${day}</div>`;
        
        days[day].forEach(slot => {
          const isFree = (slot.status === 'Свободно');
          const isMySlot = currentUser.id && (String(slot.vk_id) === currentUser.id);
          const isAdmin = currentUser.id && adminList.includes(currentUser.id);
          const canCancel = isMySlot || isAdmin;

          html += `
            <div class="slot-item">
              <span class="slot-time">${slot.time}</span>
              <div class="slot-right">
                ${isFree 
                  ? `<button class="btn-free" onclick="bookSlot(${slot.row}, '${slot.day}', '${slot.time}', this)">Записаться</button>` 
                  : `<span class="badge-booked">👤 ${slot.name}</span>`}
                ${!isFree && canCancel 
                  ? `<button class="btn-cancel" title="Отменить запись" onclick="cancelSlot(${slot.row}, '${slot.day}', '${slot.time}', this)">✕</button>` 
                  : ''}
              </div>
            </div>
          `;
        });

        html += `</div>`;
      }

      document.getElementById('content').innerHTML = html;
    }

    // 4. Запись:
    function bookSlot(row, day, time, btn) {
      if (!confirm("Записаться на " + day + " в " + time + " под именем " + currentUser.name + "?")) return;
      btn.innerText = "⏳";
      btn.disabled = true;

      fetch(API_URL + "?action=book&row=" + row + "&name=" + encodeURIComponent(currentUser.name) + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            loadSchedule();
          } else {
            alert(res.error || "Ошибка записи");
            loadSchedule();
          }
        });
    }

    // 5. Отмена:
    function cancelSlot(row, day, time, btn) {
      if (!confirm("Отменить запись на " + day + " в " + time + "?")) return;
      btn.innerText = "⏳";
      btn.disabled = true;

      fetch(API_URL + "?action=cancel&row=" + row + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            loadSchedule();
          } else {
            alert(res.error || "Ошибка отмены");
            loadSchedule();
          }
        });
    }
  </script>
</body>
</html>
