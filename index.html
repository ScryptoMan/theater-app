<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на мастерство</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #edeef0;
      color: #000;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      font-size: 19px;
      margin: 4px 0 14px;
      color: #2c3e50;
    }
    /* Вкладки для админа */
    .tabs {
      display: none;
      margin-bottom: 14px;
      background: #e1e3e6;
      padding: 3px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: #555;
    }
    .tab-btn.active {
      background: #fff;
      color: #000;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    /* Карточки расписания */
    .day-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .day-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 10px;
      color: #224b7a;
      border-bottom: 1px solid #f2f3f5;
      padding-bottom: 6px;
    }
    .slot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #f5f5f5;
    }
    .slot-item:last-child {
      border-bottom: none;
    }
    .slot-time {
      font-weight: 600;
      font-size: 15px;
    }
    .slot-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-booked {
      background: #f0f2f5;
      color: #656565;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-free {
      background: #4bb34b;
      color: #fff;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      background: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    /* Стили конструктора админки */
    .admin-panel {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .btn-secondary {
      background: #e5ebf1;
      color: #224b7a;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      width: 100%;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .add-form {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .add-form select, .add-form input {
      padding: 8px;
      border: 1px solid #dce1e6;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-add {
      background: #2787f5;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .builder-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
      border-bottom: 1px solid #f2f3f5;
    }
    .btn-publish {
      background: #2787f5;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      width: 100%;
      cursor: pointer;
      margin-top: 14px;
    }
    .lock-box {
      background: #fff;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      margin-top: 40px;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎭 Индивидуальное мастерство</h2>

    <!-- Вкладки только для администратора -->
    <div id="adminTabs" class="tabs">
      <button class="tab-btn active" onclick="switchTab('schedule')">📅 Расписание</button>
      <button class="tab-btn" onclick="switchTab('admin')">⚙️ Конструктор недели</button>
    </div>

    <!-- Вкладка 1: Просмотр и запись -->
    <div id="tabSchedule">
      <div id="content" class="loading">⏳ Загружаем расписание...</div>
    </div>

    <!-- Вкладка 2: Конструктор для админа -->
    <div id="tabAdmin" style="display:none;">
      <div class="admin-panel">
        <button class="btn-secondary" onclick="loadTemplate()">📋 Вставить шаблон из таблицы</button>
        
        <div class="add-form">
          <select id="newDay" style="flex:1;">
            <option>Вторник</option>
            <option>Среда</option>
            <option>Четверг</option>
            <option>Пятница</option>
            <option>Суббота</option>
            <option>Воскресенье</option>
            <option>Понедельник</option>
          </select>
          <input type="text" id="newTime" placeholder="15:00" style="width:70px;">
          <button class="btn-add" onclick="addBuilderSlot()">+ Слот</button>
        </div>

        <div id="builderList" style="margin-top:10px; max-height:220px; overflow-y:auto;">
          <p style="color:#888; font-size:13px; text-align:center;">Сетка пуста. Загрузите шаблон или добавьте часы вручную.</p>
        </div>

        <button class="btn-publish" onclick="publishNewWeek()">🚀 Опубликовать новую неделю в чат</button>
      </div>
    </div>
  </div>

  <script>
    vkBridge.send('VKWebAppInit');

    let currentUser = { name: "Ученик", id: "" };
    let adminList = [];
    let builderSlots = [];
    const API_URL = "https://script.google.com/macros/s/AKfycbwpKimw8EQfVQfuH4p7dYNIZM-UWQQNBDD5iUG_stdMpvTshCdJZmlC8BCn9rMnwwsNsA/exec";

    // 1. Инициализация пользователя:
    vkBridge.send('VKWebAppGetUserInfo')
      .then(user => {
        if (user && user.id) {
          currentUser.id = String(user.id);
          currentUser.name = user.first_name + " " + (user.last_name ? user.last_name[0] + "." : "");
        }
        loadSchedule();
      })
      .catch(() => {
        const urlParams = new URLSearchParams(window.location.search);
        currentUser.id = urlParams.get('vk_user_id') || "";
        loadSchedule();
      });

    // 2. Загрузка данных:
    function loadSchedule() {
      fetch(API_URL + "?vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(data => {
          if (data.access_denied) {
            document.getElementById('content').innerHTML = `
              <div class="lock-box">
                <div style="font-size:42px;margin-bottom:12px;">🔒</div>
                <h3 style="margin:0 0 8px;color:#c62828;">Доступ ограничен</h3>
                <p style="color:#555;font-size:14px;">${data.error}</p>
              </div>`;
            return;
          }

          adminList = (data.admins || []).map(String);
          
          // Если пользователь админ — показываем вкладку конструктора:
          if (adminList.includes(currentUser.id)) {
            document.getElementById('adminTabs').style.display = 'flex';
          }

          renderSchedule(data.schedule || []);
        });
    }

    // 3. Отрисовка расписания:
    function renderSchedule(items) {
      if (!items || items.length === 0) {
        document.getElementById('content').innerHTML = '<p style="text-align:center;">Расписание пока пусто</p>';
        return;
      }

      const days = {};
      items.forEach(item => {
        if (!days[item.day]) days[item.day] = [];
        days[item.day].push(item);
      });

      let html = '';
      for (const day in days) {
        html += `<div class="day-card"><div class="day-title">🗓 ${day}</div>`;
        days[day].forEach(slot => {
          const isFree = (slot.status === 'Свободно');
          const isMySlot = currentUser.id && (String(slot.vk_id) === currentUser.id);
          const isAdmin = currentUser.id && adminList.includes(currentUser.id);
          const canCancel = isMySlot || isAdmin;

          html += `
            <div class="slot-item">
              <span class="slot-time">${slot.time}</span>
              <div class="slot-right">
                ${isFree 
                  ? `<button class="btn-free" onclick="bookSlot(${slot.row}, '${slot.day}', '${slot.time}', this)">Записаться</button>` 
                  : `<span class="badge-booked">👤 ${slot.name}</span>`}
                ${!isFree && canCancel 
                  ? `<button class="btn-cancel" title="Отменить запись" onclick="cancelSlot(${slot.row}, '${slot.day}', '${slot.time}', this)">✕</button>` 
                  : ''}
              </div>
            </div>`;
        });
        html += `</div>`;
      }
      document.getElementById('content').innerHTML = html;
    }

    // 4. Переключение вкладок:
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'schedule') {
        document.querySelector('.tab-btn:first-child').classList.add('active');
        document.getElementById('tabSchedule').style.display = 'block';
        document.getElementById('tabAdmin').style.display = 'none';
      } else {
        document.querySelector('.tab-btn:last-child').classList.add('active');
        document.getElementById('tabSchedule').style.display = 'none';
        document.getElementById('tabAdmin').style.display = 'block';
      }
    }

    // 5. Функции Конструктора недели:
    function loadTemplate() {
      fetch(API_URL + "?action=get_template")
        .then(res => res.json())
        .then(template => {
          builderSlots = template || [];
          renderBuilder();
        });
    }

    function addBuilderSlot() {
      const day = document.getElementById('newDay').value;
      const time = document.getElementById('newTime').value.trim();
      if (!time) return alert("Введите время!");
      builderSlots.push({ day, time });
      document.getElementById('newTime').value = '';
      renderBuilder();
    }

    function removeBuilderSlot(idx) {
      builderSlots.splice(idx, 1);
      renderBuilder();
    }

    function renderBuilder() {
      if (builderSlots.length === 0) {
        document.getElementById('builderList').innerHTML = '<p style="color:#888; font-size:13px; text-align:center;">Сетка пуста</p>';
        return;
      }
      let html = '';
      builderSlots.forEach((s, idx) => {
        html += `
          <div class="builder-item">
            <span><b>${s.day}</b> — ${s.time}</span>
            <span style="color:#d32f2f; cursor:pointer; font-weight:bold; padding:0 6px;" onclick="removeBuilderSlot(${idx})">✕</span>
          </div>`;
      });
      document.getElementById('builderList').innerHTML = html;
    }

    function publishNewWeek() {
      if (builderSlots.length === 0) return alert("Сетка расписания пуста!");
      if (!confirm("Опубликовать новую неделю в чат? Это очистит текущие записи!")) return;

      const btn = document.querySelector('.btn-publish');
      btn.innerText = "⏳ Публикация...";
      btn.disabled = true;

      const url = API_URL + "?action=publish_new_week&vk_id=" + encodeURIComponent(currentUser.id) + "&slots=" + encodeURIComponent(JSON.stringify(builderSlots));

      fetch(url)
        .then(res => res.json())
        .then(res => {
          btn.innerText = "🚀 Опубликовать новую неделю в чат";
          btn.disabled = false;
          if (res.success) {
            alert("✅ Новое расписание опубликовано в беседу!");
            switchTab('schedule');
            loadSchedule();
          } else {
            alert("❌ " + (res.error || "Ошибка"));
          }
        });
    }

    // Запись и отмена:
    function bookSlot(row, day, time, btn) {
      if (!confirm("Записаться на " + day + " в " + time + " под именем " + currentUser.name + "?")) return;
      btn.innerText = "⏳";
      btn.disabled = true;

      fetch(API_URL + "?action=book&row=" + row + "&name=" + encodeURIComponent(currentUser.name) + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) loadSchedule();
          else alert(res.error || "Ошибка записи");
        });
    }

    function cancelSlot(row, day, time, btn) {
      if (!confirm("Отменить запись на " + day + " в " + time + "?")) return;
      btn.innerText = "⏳";
      btn.disabled = true;

      fetch(API_URL + "?action=cancel&row=" + row + "&vk_id=" + encodeURIComponent(currentUser.id))
        .then(res => res.json())
        .then(res => {
          if (res.success) loadSchedule();
          else alert(res.error || "Ошибка отмены");
        });
    }
  </script>
</body>
</html>
