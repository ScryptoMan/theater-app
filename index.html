<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на мастерство</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #edeef0;
      color: #000;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      font-size: 19px;
      margin: 8px 0 16px;
      color: #2c3e50;
    }
    .day-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .day-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 10px;
      color: #224b7a;
      border-bottom: 1px solid #f2f3f5;
      padding-bottom: 6px;
    }
    .slot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #f5f5f5;
    }
    .slot-item:last-child {
      border-bottom: none;
    }
    .slot-time {
      font-weight: 600;
      font-size: 15px;
    }
    .badge-booked {
      background: #f0f2f5;
      color: #656565;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-free {
      background: #4bb34b;
      color: #fff;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-free:hover {
      background: #3e9e3e;
    }
    .btn-free:disabled {
      background: #a5d6a7;
      cursor: not-allowed;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎭 Индивидуальное мастерство</h2>
    <div id="content" class="loading">⏳ Загружаем расписание...</div>
  </div>

  <script>
    // 1. Инициализируем ВК и автоматически берем имя пользователя:
    vkBridge.send('VKWebAppInit');

    let currentUser = { name: "Ученик", id: "" };
    vkBridge.send('VKWebAppGetUserInfo')
      .then(user => {
        if (user && user.first_name) {
          currentUser.name = user.first_name + " " + (user.last_name ? user.last_name[0] + "." : "");
          currentUser.id = user.id;
        }
      })
      .catch(e => console.log("Не удалось получить профиль", e));

    const API_URL = "https://script.google.com/macros/s/AKfycbwpKimw8EQfVQfuH4p7dYNIZM-UWQQNBDD5iUG_stdMpvTshCdJZmlC8BCn9rMnwwsNsA/exec";

    // 2. Загрузка данных:
    function loadSchedule() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => renderSchedule(data))
        .catch(err => {
          document.getElementById('content').innerHTML = '<p style="color:red;text-align:center;">Ошибка загрузки расписания</p>';
          console.error(err);
        });
    }

    // 3. Отрисовка:
    function renderSchedule(items) {
      if (!items || items.length === 0) {
        document.getElementById('content').innerHTML = '<p style="text-align:center;">Расписание пусто</p>';
        return;
      }

      const days = {};
      items.forEach(item => {
        if (!days[item.day]) days[item.day] = [];
        days[item.day].push(item);
      });

      let html = '';
      for (const day in days) {
        html += `<div class="day-card"><div class="day-title">🗓 ${day}</div>`;
        
        days[day].forEach(slot => {
          const isFree = (slot.status === 'Свободно');
          html += `
            <div class="slot-item">
              <span class="slot-time">${slot.time}</span>
              ${isFree 
                ? `<button class="btn-free" onclick="bookSlot(${slot.row}, '${slot.day}', '${slot.time}', this)">Записаться</button>` 
                : `<span class="badge-booked">👤 ${slot.name}</span>`}
            </div>
          `;
        });

        html += `</div>`;
      }

      document.getElementById('content').innerHTML = html;
    }

    // 4. Логика записи при клике:
    function bookSlot(row, day, time, btn) {
      const confirmBooking = confirm("Записаться на " + day + " в " + time + " под именем " + currentUser.name + "?");
      if (!confirmBooking) return;

      btn.innerText = "⏳ Запись...";
      btn.disabled = true;

      const url = API_URL + "?action=book&row=" + row + "&name=" + encodeURIComponent(currentUser.name) + "&vk_id=" + encodeURIComponent(currentUser.id);

      fetch(url)
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            alert("✅ Вы успешно записаны!");
            loadSchedule(); // Мгновенно обновляем экран
          } else {
            alert("❌ Ошибка: " + (result.error || "Не удалось записаться"));
            loadSchedule();
          }
        })
        .catch(err => {
          alert("❌ Ошибка соединения");
          console.error(err);
          btn.innerText = "Записаться";
          btn.disabled = false;
        });
    }

    // Запуск при открытии:
    loadSchedule();
  </script>
</body>
</html>
