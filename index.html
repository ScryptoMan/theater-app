<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на занятия</title>
  <!-- Библиотека связи с ВК: -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #edeef0;
      color: #222;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-width: 420px;
      margin: 0 auto;
    }
    h2 { margin-top: 0; color: #2c3e50; }
    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎭 Театр: Запись на мастерство</h2>
    <div class="badge" id="status">⏳ Подключение к ВК...</div>
    <p>Окно успешно открылось прямо в беседе!</p>
  </div>

  <script>
    // Мгновенный сигнал в ВК "Я загрузилось":
    vkBridge.send('VKWebAppInit')
      .then(() => {
        document.getElementById('status').innerText = '✅ Соединение с ВК успешно!';
      })
      .catch((err) => {
        document.getElementById('status').innerText = 'Ошибка инициализации';
        console.error(err);
      });
  </script>
</body>
</html>
